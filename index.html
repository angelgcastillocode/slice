<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Slice" />
  <title>Slice — Finanzas Personales</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon.svg" />

  <!-- Fonts & Icons (Inter + Material Symbols Outlined) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <!-- Liquid Glass Monochromatic Stylesheets -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <!-- ========================================================================
       PANTALLA DE AUTENTICACIÓN (#auth-screen) — Supabase Auth + RLS
       ======================================================================== -->
  <div
    id="auth-screen"
    class="app-container"
    style="display:none;"
  >
    <div class="glass-card-hero" style="display:flex;flex-direction:column;gap:20px;padding:28px 22px;">
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;">
        <div
          class="brand-mark"
          style="width:52px;height:52px;border-radius:16px;font-size:26px;"
          aria-hidden="true"
        >
          S
        </div>
        <div>
          <span class="label-eyebrow">Bóveda Financiera Personal</span>
          <h1 class="stat-amount" style="margin:4px 0 0 0;font-size:26px;">Slice</h1>
          <p class="text-subtle" style="margin:6px 0 0 0;">
            Acceso privado protegido con Supabase Auth y Row Level Security.
          </p>
        </div>
      </div>

      <form id="auth-form" method="post" style="display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="label-eyebrow" for="auth-email">Correo Electrónico</label>
          <div class="input-well">
            <span class="material-symbols-outlined" aria-hidden="true" style="font-size:19px;color:var(--text-secondary);">mail</span>
            <input
              type="email"
              name="email"
              id="auth-email"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              inputmode="email"
              placeholder="tu@correo.com"
              required
            />
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px;">
          <label class="label-eyebrow" for="auth-password">Contraseña</label>
          <div class="input-well">
            <span class="material-symbols-outlined" aria-hidden="true" style="font-size:19px;color:var(--text-secondary);">lock</span>
            <input
              type="password"
              name="password"
              id="auth-password"
              autocomplete="current-password"
              placeholder="••••••••••••"
              required
            />
          </div>
        </div>

        <label class="glass-checkbox-row" for="auth-remember">
          <input
            type="checkbox"
            id="auth-remember"
            name="remember"
            class="glass-checkbox-input"
            checked
          />
          <span class="glass-checkbox-box" aria-hidden="true">
            <span class="material-symbols-outlined glass-checkbox-check" aria-hidden="true">check</span>
          </span>
          <span class="glass-checkbox-label">Recordar sesión y correo</span>
        </label>

        <div
          id="auth-error-box"
          class="glass-well"
          style="display:none;color:var(--error);font-size:13px;background:var(--error-tint);border-color:var(--error-border);"
        ></div>

        <button
          type="submit"
          id="auth-submit-btn"
          class="btn-primary-capsule"
          style="width:100%;height:52px;margin-top:4px;"
        >
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:20px;">login</span>
          <span id="auth-submit-text">Iniciar Sesión</span>
        </button>
      </form>

      <div style="display:flex;align-items:center;justify-content:center;gap:6px;padding-top:4px;">
        <span class="material-symbols-outlined" aria-hidden="true" style="font-size:15px;color:var(--sky);">shield_lock</span>
        <span class="label-eyebrow" style="font-size:10px;">PostgreSQL RLS • Usuario Único</span>
      </div>
    </div>
  </div>

  <!-- ========================================================================
       APP SHELL PRINCIPAL (#app-shell)
       ======================================================================== -->
  <div class="app-container" id="app-shell" style="display:none;">
    <!-- Sticky Frosted Glass Header -->
    <header class="app-header">
      <div class="header-bar">
        <div class="brand-cluster">
          <div class="brand-mark" aria-hidden="true">S</div>
          <h1 class="header-title" id="header-view-title">Inicio</h1>
        </div>
        <div class="header-actions">
          <button
            type="button"
            class="btn-glass-capsule btn-sync-pill"
            id="btn-open-data-controls"
            style="height:34px;padding:0 12px;font-size:11px;"
            title="Estado de conexión con Supabase y sesión"
          >
            <span class="pulse-dot" id="sync-status-dot" aria-hidden="true"></span>
            <span id="sync-status-label">Supabase</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Views -->
    <main class="main-content">
      <section id="view-dashboard" class="view-section active" aria-label="Inicio Dashboard"></section>
      <section id="view-calendar" class="view-section" aria-label="Calendario Financiero"></section>
      <section id="view-cards" class="view-section" aria-label="Tarjetas y MSI"></section>
      <section id="view-recurring" class="view-section" aria-label="Gastos Fijos y Préstamos"></section>
    </main>

    <!-- Soft Bottom Scrim behind Floating Dock -->
    <div class="bottom-fade-scrim" aria-hidden="true"></div>

    <!-- Floating Liquid Navigation Bar -->
    <div class="floating-nav-wrapper">
      <nav class="floating-nav" aria-label="Navegación principal">
        <button type="button" class="nav-item active" data-tab="inicio">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:22px;">home</span>
          <span class="nav-item-label">Inicio</span>
        </button>

        <button type="button" class="nav-item" data-tab="calendario">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:22px;">calendar_today</span>
          <span class="nav-item-label">Calendario</span>
        </button>

        <button
          type="button"
          class="nav-fab"
          id="btn-open-quick-entry"
          aria-label="Nuevo Movimiento Rápido"
        >
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:26px;font-weight:700;">add</span>
        </button>

        <button type="button" class="nav-item" data-tab="tarjetas">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:22px;">credit_card</span>
          <span class="nav-item-label">Tarjetas</span>
        </button>

        <button type="button" class="nav-item" data-tab="fijos">
          <span class="material-symbols-outlined" aria-hidden="true" style="font-size:22px;">repeat</span>
          <span class="nav-item-label">Fijos</span>
        </button>
      </nav>
    </div>
  </div>

  <!-- Modal Bottom-Sheet 1: Registro Rápido (<10s) -->
  <div id="modal-quick-entry" class="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- Modal Bottom-Sheet 2: Arqueo Rápido ("Cuadrar Saldo") -->
  <div id="modal-reconcile" class="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- Modal Bottom-Sheet 3: Modales Auxiliares (Abono Préstamo, Pago TDC, Alta, Sesión) -->
  <div id="modal-auxiliary" class="modal-overlay" role="dialog" aria-modal="true"></div>

  <!-- Toast Feedback -->
  <div id="toast-banner" class="toast-banner" role="status" aria-live="polite">
    <span class="material-symbols-outlined" aria-hidden="true" style="font-size:18px;">check_circle</span>
    <span id="toast-text">Acción completada</span>
  </div>

  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
